<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WashQ</title>
<meta name="apple-mobile-web-app-title" content="WashQ">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B2A4A">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap">
<script>
  // ทางเข้าหน้าต่ออายุสมาชิกของผู้ดูแลระบบ (เปิดได้เฉพาะบัญชี Google ของเจ้าของ)
  // เปิดจากไอคอนหน้าจอโฮม (โหมดแอป) หรือ ?go → ฝังหน้าต่ออายุเต็มจอ (ไม่มีแถบเตือนของ Google)
  // เปิดในเบราว์เซอร์ปกติ: หน้าวิธีติดตั้ง เพื่อให้ "เพิ่มไปยังหน้าจอโฮม" ได้ไอคอน WashQ
  // ตั๋วล็อกอินเก็บที่หน้านี้ (iPhone ล้างที่เก็บข้อมูลของกรอบ Google เมื่อปิดแอป) แล้วส่งให้กรอบเมื่อขอ
  var APP = 'https://script.google.com/macros/s/AKfycbwi2xx2yPboLQjtFIyZ26h4jR5RbTmAHs-HTmxD-T6h0AONS-98oIIPM3drThVL8v0S9A/exec';
  var asApp = navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  var embed = /[?&]go\b/.test(location.search) || asApp;
  if (embed) document.documentElement.className = 'embed';
  window.addEventListener('message', function (e) {
    if (!/^https:\/\/[^/]+\.googleusercontent\.com$/.test(e.origin) || !e.data) return;
    if (e.data.type === 'washq-ready') {
      var t = ''; try { t = localStorage.getItem('washq_token') || ''; } catch (x) {}
      e.source.postMessage({ type: 'washq-token', token: t }, e.origin);
    } else if (e.data.type === 'washq-save') {
      try { e.data.token ? localStorage.setItem('washq_token', e.data.token) : localStorage.removeItem('washq_token'); } catch (x) {}
    }
  });
  document.addEventListener('DOMContentLoaded', function () {
    if (!embed) return;
    var f = document.createElement('iframe'); f.src = APP; f.title = 'WashQ ต่ออายุสมาชิก';
    document.body.appendChild(f);
  });
</script>
<style>
  :root { --navy: #0B2A4A; --aqua: #1EC8E6; --sun: #FFC530; --ink: #0B2A4A; --muted: #4b6178; --bg: #eef4f8; --card: #fff; }
  @media (prefers-color-scheme: dark) { :root { --ink: #eaf3fa; --muted: #a9c3da; --bg: #071a2e; --card: #0f2d4d; color-scheme: dark; } }
  body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 400 17px/1.55 Kanit, sans-serif;
    padding: 40px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); display: grid; justify-items: center; }
  main { width: 100%; max-width: 420px; display: grid; gap: 22px; justify-items: center; text-align: center; }
  .icon { width: 132px; height: 132px; border-radius: 30px; box-shadow: 0 10px 30px rgba(11, 42, 74, .25); }
  h1 { margin: 0; font: 800 44px/1 Kanit, sans-serif; letter-spacing: -1px; } h1 i { font-style: normal; color: var(--aqua); }
  .sub { margin: -14px 0 0; color: var(--muted); }
  a.go { display: block; width: 100%; box-sizing: border-box; padding: 16px; border-radius: 16px; background: var(--aqua); color: #06243f;
    font: 600 20px/1.2 Kanit, sans-serif; text-decoration: none; }
  a.go:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
  .how { width: 100%; box-sizing: border-box; background: var(--card); border-radius: 18px; padding: 16px 18px; text-align: left; display: grid; gap: 8px; }
  .how b { font-weight: 600; } .how p { margin: 0; color: var(--muted); }
  html.embed main { display: none; }
  html.embed body { padding: 0; background: var(--bg); }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<main>
  <img class="icon" src="icon-512.png" alt="ไอคอน WashQ">
  <h1>Wash<i>Q</i></h1>
  <p class="sub">หน้าต่ออายุสมาชิก · เฉพาะผู้ดูแลระบบ</p>
  <a class="go" href="?go">เปิดหน้าต่ออายุ</a>
  <div class="how">
    <b>เพิ่มไอคอน WashQ ไว้บนหน้าจอมือถือ</b>
    <p>iPhone: ปุ่มแชร์ใน Safari → เพิ่มไปยังหน้าจอโฮม</p>
    <p>Android: ⋮ ใน Chrome → เพิ่มลงในหน้าจอหลัก</p>
    <p>ต้องกดเพิ่มจากหน้านี้ (ก่อนกดปุ่มด้านบน) ไอคอนจึงเป็น WashQ · กดไอคอนแล้วเข้าหน้าต่ออายุทันที</p>
  </div>
</main>
</body>
</html>
